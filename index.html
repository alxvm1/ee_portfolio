<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ee_portfolio</title>
  </head>
  <body>
    <div id="loader" style="position:fixed;inset:0;z-index:9999;background:#0c0c0c;display:flex;align-items:center;justify-content:center;transition:opacity 0.5s ease;">
      <svg viewBox="25 25 50 50" style="width:3.25em;transform-origin:center;animation:rotate4 2s linear infinite;">
        <circle r="20" cy="50" cx="50" style="fill:none;stroke:#8bb220;stroke-width:2;stroke-dasharray:1,200;stroke-dashoffset:0;stroke-linecap:round;animation:dash4 1.5s ease-in-out infinite;"></circle>
      </svg>
    </div>
    <style>
      @keyframes rotate4 { 100% { transform: rotate(360deg); } }
      @keyframes dash4 {
        0% { stroke-dasharray: 1, 200; stroke-dashoffset: 0; }
        50% { stroke-dasharray: 90, 200; stroke-dashoffset: -35px; }
        100% { stroke-dashoffset: -125px; }
      }
    </style>
    <div id="root" style="opacity:0;transition:opacity 0.5s ease;"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
